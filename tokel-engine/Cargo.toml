[package]
name = "tokel-engine"
description = "The core parsing, AST, and bottom-up evaluation engine for the Tokel macro language."
keywords = ["parsing", "ast", "evaluation", "metaprogramming", "tokel"]
categories = ["development-tools::procedural-macro-helpers", "development-tools::build-utils"]
readme = "README.md"
repository.workspace = true
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]

[dependencies.ahash]
version = "0.8"

[dependencies.proc-macro2]
version = "1.0"

[dependencies.syn]
version = "2.0"
features = ["clone-impls", "parsing", "extra-traits"]

[dev-dependencies.quote]
version = "1.0"
