[package]
name = "tokel-std"
description = "A standard library of built-in TokenStream transformers for the Tokel engine."
keywords = ["transformers", "utilities", "proc-macro", "tokel"]
categories = ["development-tools::procedural-macro-helpers", "development-tools::build-utils"]
readme = "README.md"
repository.workspace = true
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
heck = "0.5.0"
tokel-engine = { version = "0.2.0", path = "../tokel-engine" }

[dependencies.proc-macro2]
version = "1.0"

[dependencies.syn]
version = "2.0"
features = ["clone-impls", "parsing", "extra-traits"]

[dependencies.quote]
version = "1.0"
