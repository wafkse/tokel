name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt --component clippy --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Format
        run: cargo +stable fmt --all -- --check

      - name: Check
        run: cargo +stable check --workspace --all-targets

      - name: Clippy
        run: cargo +stable clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo +stable test --workspace

      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo +stable doc --workspace --no-deps

      - name: Facade feature tests
        run: |
          cargo +stable test -p tokel --no-default-features
          cargo +stable test -p tokel --no-default-features --features derive
          cargo +stable test -p tokel --no-default-features --features engine
          cargo +stable test -p tokel --all-features

      - name: Package workspace
        run: cargo +stable package --workspace

  msrv:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install MSRV
        run: |
          rustup toolchain install 1.88.0 --profile minimal --no-self-update
          rustup default 1.88.0

      - uses: Swatinem/rust-cache@v2.9.1
        with:
          shared-key: msrv

      - name: Check MSRV
        run: cargo +1.88.0 check --workspace --all-targets

  dependency-policy:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - uses: EmbarkStudios/cargo-deny-action@v2.1.1

  semver:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2

  coverage:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Install stable Rust
        run: |
          rustup toolchain install stable --profile minimal --component llvm-tools-preview --no-self-update
          rustup default stable

      - uses: Swatinem/rust-cache@v2.9.1

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-llvm-cov

      - name: Generate coverage
        run: cargo +stable llvm-cov --workspace --all-features --lcov --output-path lcov.info

      - name: Upload coverage
        uses: actions/upload-artifact@v7.0.1
        with:
          name: coverage-lcov
          path: lcov.info
